# Build, migrate, provision, publish.
#
# One job rather than four, because every step after the first needs a `terraform output` from the
# step before it, and passing those between jobs would mean serialising them through artifacts for
# no gain.
#
# The steps guard themselves on what this project actually contains - hashFiles for the React and
# Blazor front ends, a glob for the events service - so the same file works whether or not those
# were scaffolded. Nothing here needs editing when one is added later.
#
# Dispatch only. Nothing deploys on a push: merging leaves dev and staging ready to deploy, and a
# person (or the factory, for a preview) decides when. Production is not deployed from here at all,
# and variables.tf refuses it as well.
#
#   environment = dev | staging   envs/<environment>.tfvars, GitHub environment of the same name
#   environment = j<NNN>          one factory job's ephemeral preview: envs/ephemeral.tfvars,
#                                 GitHub environment "preview", dispatched on the job's branch
#
# Terraform runs in HCP Terraform, workspace <repository>-<environment> in project <repository>.
# HCP holds the Azure credentials (dynamic provider credentials), so Terraform needs only:
#   TF_API_TOKEN                  secret, an HCP team token scoped to this repository's project
#   TF_CLOUD_ORGANIZATION         variable, the HCP organization
#
# Everything else here - the image build, the schema, the front end upload - talks to Azure
# directly, over OIDC. Three variables per GitHub environment - ids, not secrets - and no passwords:
#   AZURE_CLIENT_ID         app registration with a federated credential for
#                           repo:<owner>/<repository>:environment:<GitHub environment>
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
# That app registration needs AcrPush and, for the schema step, Key Vault Secrets User and the
# database firewall rights. Role assignments are made by Terraform in HCP, not by it.

name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: dev, staging, or j<NNN> for a factory job's ephemeral preview
        type: string
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  # One apply per environment at a time. HCP locks the workspace too; this keeps the queue here.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_ENV: ${{ inputs.environment }}
  TF_VARS: ${{ startsWith(inputs.environment, 'j') && 'ephemeral' || inputs.environment }}
  IMAGE_TAG: ${{ github.sha }}
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_CLOUD_PROJECT: ${{ github.event.repository.name }}
  TF_WORKSPACE: ${{ github.event.repository.name }}-${{ inputs.environment }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(inputs.environment, 'j') && 'preview' || inputs.environment }}
    defaults:
      run:
        shell: bash

    steps:
      - name: refuse anything but dev, staging or a job preview
        run: |
          if ! [[ "$TF_ENV" =~ ^(dev|staging|j[0-9]{1,7})$ ]]; then
            echo "::error::environment must be dev, staging or j<NNN>; got '$TF_ENV'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: terraform init
        working-directory: IaC
        run: terraform init

      # Runs queued through HCP's API - a teardown, and the workspace's auto-destroy timer - get no
      # -var flags, only the configuration the last apply uploaded. This file goes up with every
      # apply below, so those runs see this environment's variables too; without it a destroy fails
      # on "project_name is not set" and the preview is never torn down. Gitignored, never committed.
      - name: record this environment's variables for API-queued runs
        working-directory: IaC
        run: |
          { cat "envs/${TF_VARS}.tfvars"; echo; echo "environment = \"${TF_ENV}\""; } > zz-env.auto.tfvars

      # The registry and the database first, on their own. The images cannot be built before the
      # registry exists and the schema cannot be applied before the database does - but the
      # container apps must not be created until there is an image for them to pull. -target is the
      # right tool for exactly this ordering problem and for nothing else.
      - name: terraform apply (registry and database)
        working-directory: IaC
        run: |
          terraform apply -auto-approve \
            -var-file="envs/${TF_VARS}.tfvars" \
            -var="environment=${TF_ENV}" \
            -target=azurerm_container_registry.main \
            -target=module.database \
            -target=azurerm_role_assignment.kv_secrets_deployer

      - name: read outputs
        working-directory: IaC
        run: |
          {
            echo "ACR_NAME=$(terraform output -raw acr_name)"
            echo "RG_NAME=$(terraform output -raw resource_group_name)"
            echo "KV_NAME=$(terraform output -raw key_vault_name)"
            echo "DB_PROVIDER=$(terraform output -raw database_provider)"
            echo "APPDB_SECRET=$(terraform output -raw appdb_connection_secret_name)"
            echo "DB_SERVER=$(terraform output -raw database_server_name 2>/dev/null || true)"
            echo "DB_SERVER_RG=$(terraform output -raw database_server_resource_group 2>/dev/null || true)"
            echo "DB_FQDN=$(terraform output -raw database_server_fqdn 2>/dev/null || true)"
            echo "DB_ROLE=$(terraform output -raw database_role 2>/dev/null || true)"
            echo "DB_NAMES=$(terraform output -raw database_names 2>/dev/null || true)"
            echo "DB_STORAGE=$(terraform output -raw database_storage_account_name 2>/dev/null || true)"
          } >> "$GITHUB_ENV"

      - name: build and push images
        run: |
          set -euo pipefail
          api_project=$(ls -d src/*.api | head -1)
          project_name=$(basename "$api_project" .api)

          az acr build --registry "$ACR_NAME" \
            --image "${project_name}-api:${IMAGE_TAG}" \
            --file "${api_project}/Dockerfile" .

          # One events host at most, and only if this project has the slice at all. The Functions
          # project matches the same glob and has no image - it deploys as a zip, below.
          events_project=$(ls -d src/*.events* 2>/dev/null | grep -v -e ".tests" -e ".functions" | head -1 || true)
          if [ -n "$events_project" ]; then
            az acr build --registry "$ACR_NAME" \
              --image "${project_name}-events:${IMAGE_TAG}" \
              --file "${events_project}/Dockerfile" .
          fi

      # The runner is not an Azure resource, so the database's AllowAzureServices rule does not
      # cover it. Opened here and closed unconditionally at the end - leaving it open would hand
      # every future workflow run a standing hole.
      - name: open the database firewall for this runner
        if: env.DB_PROVIDER != 'sqlite'
        run: |
          set -euo pipefail
          runner_ip=$(curl -fsS https://api.ipify.org)
          echo "RUNNER_IP=$runner_ip" >> "$GITHUB_ENV"
          case "$DB_PROVIDER" in
            postgres)
              az postgres flexible-server firewall-rule create \
                --resource-group "$DB_SERVER_RG" --server-name "$DB_SERVER" --name "gha-$TF_ENV" \
                --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" ;;
            sqlserver)
              az sql server firewall-rule create \
                --resource-group "$DB_SERVER_RG" --server "$DB_SERVER" --name "gha-$TF_ENV" \
                --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" ;;
          esac

      # Sign in again. GitHub's OIDC token lives five minutes, and az presents it again whenever it
      # needs a token for a new resource - Key Vault here, Storage for the SQLite seed. The registry
      # and database apply above takes longer than that, so without this the schema step fails with
      # AADSTS700024 ("Client assertion is not within its valid time range").
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A preview on the factory's shared server gets a login of its own, so it cannot reach another
      # preview's database. This is here, not in Terraform, because HCP's runners sit outside Azure and
      # the firewall keeps them out; this runner has just been let in. A destroy runs in HCP and cannot
      # drop the role either, so each deploy drops the ones whose databases have gone.
      - name: create the preview's database login
        if: env.DB_ROLE != ''
        run: |
          set -euo pipefail
          admin_pw=$(az keyvault secret show --vault-name "$KV_NAME" --name postgres-admin-password --query value -o tsv)
          conn=$(az keyvault secret show --vault-name "$KV_NAME" --name "$APPDB_SECRET" --query value -o tsv)
          role_pw=$(sed -E 's/.*Password=([^;]*).*/\1/' <<< "$conn")
          echo "::add-mask::$admin_pw"
          echo "::add-mask::$role_pw"
          export PGPASSWORD="$admin_pw" PGSSLMODE=require PGHOST="$DB_FQDN" PGUSER=pgadmin PGDATABASE=postgres
          psql -v ON_ERROR_STOP=1 -q -v role="$DB_ROLE" -v pw="$role_pw" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec
          SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'pw') \gexec
          SELECT format('GRANT %I TO CURRENT_USER', :'role') \gexec
          SQL
          for db in $DB_NAMES; do
            psql -v ON_ERROR_STOP=1 -q -v role="$DB_ROLE" -v db="$db" <<'SQL'
          SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'role') \gexec
          SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db') \gexec
          SQL
          done
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          SELECT format('DROP ROLE %I', r.rolname) FROM pg_roles r
           WHERE r.rolname LIKE 'preview\_%' AND NOT EXISTS (SELECT FROM pg_database d WHERE d.datdba = r.oid) \gexec
          SQL

      # Migrations are Development-only inside the application, deliberately: a deployment must not
      # apply an unreviewed schema change, and concurrent replicas would race. This is the step that
      # replaces InitializeDatabaseAsync.
      - name: apply the schema
        if: env.DB_PROVIDER != 'sqlite'
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version "10.*" \
            || dotnet tool update --global dotnet-ef --version "10.*"
          # The deployer's Secrets User role (kv_secrets_deployer) was created minutes ago, and Azure
          # RBAC can take a few more to reach the vault: retry for up to five minutes.
          for i in $(seq 1 20); do
            conn=$(az keyvault secret show --vault-name "$KV_NAME" \
                     --name "$APPDB_SECRET" --query value -o tsv 2>/dev/null) && break
            echo "waiting for the Key Vault role to propagate ($i/20)"; sleep 15
          done
          [ -n "${conn:-}" ] || { echo "::error::cannot read $APPDB_SECRET from $KV_NAME as the deployer identity"; exit 1; }
          # dotnet ef builds but never restores (NETSDK1004 on a fresh runner).
          dotnet restore "$(ls -d src/*.api.migrations.* | head -1)"
          dotnet restore "$(ls -d src/*.api | head -1)"
          dotnet ef database update \
            --project "$(ls -d src/*.api.migrations.* | head -1)" \
            --startup-project "$(ls -d src/*.api | head -1)" \
            --connection "$conn"

      # SQLite has no server to connect to: the file lives on the Azure Files share the API mounts.
      # So the schema is built here and the file uploaded - once. Uploading again would overwrite
      # whatever the running service has written since, which is why this is guarded on absence
      # rather than run every time. A later schema change on this branch is a manual operation, and
      # that is one of the costs of choosing SQLite.
      - name: seed the SQLite file if the share is empty
        if: env.DB_PROVIDER == 'sqlite'
        run: |
          set -euo pipefail
          exists=$(az storage file exists --account-name "$DB_STORAGE" --share-name data \
                     --path app.db --auth-mode login --query exists -o tsv)
          if [ "$exists" = "true" ]; then
            echo "app.db is already on the share; leaving it alone."
            exit 0
          fi
          dotnet tool install --global dotnet-ef --version "10.*" \
            || dotnet tool update --global dotnet-ef --version "10.*"
          dotnet restore "$(ls -d src/*.api.migrations.* | head -1)"
          dotnet restore "$(ls -d src/*.api | head -1)"
          dotnet ef database update \
            --project "$(ls -d src/*.api.migrations.* | head -1)" \
            --startup-project "$(ls -d src/*.api | head -1)" \
            --connection "Data Source=$PWD/app.db"
          az storage file upload --account-name "$DB_STORAGE" --share-name data \
            --source "$PWD/app.db" --path app.db --auth-mode login

      - name: terraform apply
        working-directory: IaC
        run: |
          terraform apply -auto-approve \
            -var-file="envs/${TF_VARS}.tfvars" \
            -var="environment=${TF_ENV}" \
            -var="image_tag=${IMAGE_TAG}"

      # The Blazor WebAssembly host is genuinely cross-origin, and its Static Web App's hostname
      # does not exist until the apply above has run. containerapp.api.tf is part of the base
      # scaffold and cannot reference a resource declared in an add-on file, so this second pass is
      # what puts the origin into the API's Cors:AllowedOrigins. Without it the page loads and every
      # request fails in the browser while the API logs healthy 200s.
      - name: terraform apply (Blazor CORS origin)
        working-directory: IaC
        run: |
          set -euo pipefail
          blazor_url=$(terraform output -raw blazor_web_url 2>/dev/null || true)
          if [ -z "$blazor_url" ]; then
            echo "No Blazor WebAssembly front end in this project; nothing to allow."
            exit 0
          fi
          terraform apply -auto-approve \
            -var-file="envs/${TF_VARS}.tfvars" \
            -var="environment=${TF_ENV}" \
            -var="image_tag=${IMAGE_TAG}" \
            -var="cors_allowed_origins=[\"${blazor_url}\"]"

      # The widget-completed consumer. Flex Consumption runs code rather than an image, so this is a
      # zip of the published worker rather than an `az acr build`, and it has to follow the apply
      # that creates the function app.
      - name: publish the Functions consumer
        if: hashFiles('src/*.events.functions/*.csproj') != ''
        working-directory: IaC
        run: |
          set -euo pipefail
          functions_project=$(ls -d ../src/*.events.functions | head -1)
          dotnet publish "$functions_project" -c Release -o "$RUNNER_TEMP/functions"
          (cd "$RUNNER_TEMP/functions" && zip -qr "$RUNNER_TEMP/functions.zip" .)
          az functionapp deployment source config-zip \
            --resource-group "$RG_NAME" \
            --name "$(terraform output -raw function_app_name)" \
            --src "$RUNNER_TEMP/functions.zip"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: publish the React front end
        if: hashFiles('src/ui/react/package.json') != ''
        working-directory: IaC
        run: |
          set -euo pipefail
          npm --prefix ../src/ui/react ci
          npm --prefix ../src/ui/react run build
          npm install -g @azure/static-web-apps-cli
          swa deploy ../src/ui/react/dist \
            --deployment-token "$(terraform output -raw react_api_key)" \
            --env production

      # ApiBaseAddress is a static file the browser fetches, not configuration the platform can
      # inject, and it ships pointing at http://localhost:5058. Rewriting it here is the only thing
      # that makes the deployed WebAssembly host talk to the deployed API.
      - name: publish the Blazor WebAssembly front end
        if: hashFiles('src/ui/blazor/*.Blazor.Maui.Web/*.csproj') != ''
        working-directory: IaC
        run: |
          set -euo pipefail
          api_url=$(terraform output -raw api_url)
          host_project=$(ls -d ../src/ui/blazor/*.Blazor.Maui.Web | head -1)

          tmp=$(mktemp)
          jq --arg url "$api_url" '.ApiBaseAddress = $url' \
            "${host_project}/wwwroot/appsettings.json" > "$tmp"
          mv "$tmp" "${host_project}/wwwroot/appsettings.json"

          dotnet publish "$host_project" -c Release -o "$RUNNER_TEMP/blazor"
          npm install -g @azure/static-web-apps-cli
          swa deploy "$RUNNER_TEMP/blazor/wwwroot" \
            --deployment-token "$(terraform output -raw blazor_web_api_key)" \
            --env production

      - name: close the database firewall
        if: always() && env.DB_PROVIDER != 'sqlite' && env.RUNNER_IP != ''
        run: |
          case "$DB_PROVIDER" in
            postgres)
              az postgres flexible-server firewall-rule delete --yes \
                --resource-group "$DB_SERVER_RG" --server-name "$DB_SERVER" --name "gha-$TF_ENV" || true ;;
            sqlserver)
              az sql server firewall-rule delete \
                --resource-group "$DB_SERVER_RG" --server "$DB_SERVER" --name "gha-$TF_ENV" || true ;;
          esac

      # Where it landed. The factory reads the same outputs from HCP; this is for a person looking
      # at the run.
      - name: summary
        working-directory: IaC
        run: |
          {
            echo "### ${TF_WORKSPACE}"
            for name in react_url blazor_web_url api_url; do
              url=$(terraform output -raw "$name" 2>/dev/null || true)
              [ -n "$url" ] && echo "- ${name}: ${url}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
