<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Maskable app icon: the favicon.svg mark on an opaque field.

    A maskable icon is cropped by the launcher to a circle, squircle or rounded
    square, so it must (a) be opaque edge to edge and (b) keep its content
    inside the safe zone - the centred circle of 80% diameter. A square that
    fits inside that circle has a side of 409.6 / sqrt(2) = 289.6, hence the
    288-wide box below: translate(112 118) scale(6) maps the 48x46 source
    artwork onto it, centred.

    Placeholder branding - replace with your own mark.
  -->
  <rect width="512" height="512" fill="#fafcfe"/>
  <g transform="translate(112 118) scale(6)">
