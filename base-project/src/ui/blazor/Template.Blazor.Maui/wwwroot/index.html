<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Template.Blazor.Maui</title>
    <base href="/" />

    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="_content/Template.Blazor.Maui.Pages/app.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Template.Blazor.Maui.styles.css" />
    <link rel="icon" href="data:," />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Do NOT add FluentUI's initializersLoader.webview.js here. It exists for older SDKs that
         emitted the JS-initializer manifest as "<app-name>.modules.json" in the wwwroot root, and
         it works by rewriting the fetch of _framework/blazor.modules.json to that name. This SDK
         emits the manifest at _framework/blazor.modules.json (confirmed in
         staticwebassets.build.json - no app-named variant exists in build or publish), so the
         rewrite points at a 404. blazor.webview.js calls .json() on that response without checking
         it, so the throw kills startup and the app sits on "Loading..." forever.

         The manifest already lists Microsoft.FluentUI.AspNetCore.Components.lib.module.js, so
         JS-module FluentUI components (FluentDataGrid, FluentNavMenu, tooltips, dialogs) register
         natively without the loader.

         autostart must stay on: nothing in this page calls Blazor.start(), so autostart="false"
         also leaves the app on "Loading..." forever. -->
    <script src="_framework/blazor.webview.js"></script>

</body>

</html>
