<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template.Blazor.Maui.Web</title>
    <base href="/" />

    <!-- The preload link, the importmap script and the fingerprint token on the blazor script
         below are all rewritten at build time by OverrideHtmlAssetPlaceholders. Removing any of
         them breaks asset fingerprinting. (Written without the literal tokens because the build
         rewrites them inside comments too.) -->
    <link rel="preload" id="webassembly" />

    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="_content/Template.Blazor.Maui.Pages/app.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Template.Blazor.Maui.Web.styles.css" rel="stylesheet" />

    <!-- Progressive web app. The theme color matches the boot spinner in css/app.css.
         icon-192.png is placeholder branding - replace it, and add a 512px and a
         maskable variant, before shipping anything real. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1b6ec2" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <!-- Always this filename: the ServiceWorker item in the .csproj swaps the published
         worker in under it at publish time. -->
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
